<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NOVI BEOGRAD 03:47</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:crosshair}
#wrap{position:fixed;inset:0;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:crisp-edges;image-rendering:pixelated}
#hud{pointer-events:none}
#crt{position:absolute;inset:0;pointer-events:none;mix-blend-mode:multiply;
 background:repeating-linear-gradient(to bottom,rgba(255,255,255,1) 0,rgba(255,255,255,1) 2px,rgba(170,170,180,1) 3px,rgba(170,170,180,1) 4px)}
#vig{position:absolute;inset:0;pointer-events:none;
 background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.62) 100%);box-shadow:inset 0 0 90px rgba(0,0,0,.7)}
#start{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
 background:rgba(2,3,5,.72);color:#c8c8b8;font:bold 14px Menlo,Monaco,Consolas,"Courier New",monospace;letter-spacing:2px;
 text-align:center;transition:opacity 1.2s;text-shadow:2px 2px 0 #000}
#start.off{opacity:0;pointer-events:none}
#start h1{margin:0;font-size:40px;letter-spacing:8px;color:#ff9a3c;text-shadow:3px 3px 0 #3a1400}
#start .s{color:#77776c;font-size:12px;line-height:1.9}
#start .b{animation:bl 1.1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
#tb{position:absolute;right:14px;bottom:34px;display:none;gap:8px;grid-template-columns:auto auto}
#jb{position:absolute;left:28px;bottom:60px;width:110px;height:110px;margin:0;border:2px solid rgba(200,200,184,.4);border-radius:50%;display:none;pointer-events:none;background:rgba(10,10,12,.25)}
#jk{position:absolute;left:33px;top:33px;width:44px;height:44px;border-radius:50%;background:rgba(200,200,184,.45)}
@media(max-width:520px){#start h1{font-size:26px;letter-spacing:4px}#start{font-size:11px;padding:0 10px}#start .s{font-size:10px}}
#tb button{font:bold 13px Menlo,monospace;background:rgba(10,10,12,.6);color:#c8c8b8;border:2px solid #77776c;padding:14px 12px;letter-spacing:1px}
</style>
</head>
<body>
<div id="wrap">
 <canvas id="game"></canvas>
 <canvas id="hud"></canvas>
 <div id="crt"></div><div id="vig"></div>
 <div id="tb"><button id="bE">PIVO</button><button id="bQ">PLJUGA</button><button id="bT">DAN</button><button id="bM">MUZ</button></div>
 <div id="jb"><div id="jk"></div></div>
 <div id="start">
  <h1>NOVI BEOGRAD</h1>
  <div>БЛОК 23 &middot; 03:47</div>
  <div class="s">WASD / STRELICE &mdash; HODAJ &nbsp; SHIFT &mdash; BRŽE<br>MIŠ / PRST &mdash; KAMERA<br>[E] PIVO &nbsp;|&nbsp; [Q] PLJUGA &nbsp;|&nbsp; [T] DAN / NOĆ &nbsp;|&nbsp; [M] MUZIKA</div>
  <div class="b">KLIKNI / DODIRNI DA POČNEŠ</div>
 </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
